
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина | The X Shop</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/modern-cart-styles.css">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <a href="index.html"><img src="public/The X Shop text.svg" alt="The X Shop" /></a>
                </div>
                <nav class="main-nav">
                    <ul class="nav-list">
                        <li><a href="index.html" class="nav-link">Главная</a></li>
                        <li><a href="catalog.html" class="nav-link">Каталог</a></li>
                        <li><a href="about.html" class="nav-link">О нас</a></li>
                        <li><a href="contacts.html" class="nav-link">Контакты</a></li>
                    </ul>
                </nav>
                <div class="header-actions">
                    <a href="wishlist.html" class="action-icon wishlist-icon" title="Избранное">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg>
                    </a>
                    <a href="cart.html" class="action-icon cart-icon active" title="Корзина">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
                        <span class="cart-counter"></span>
                    </a>
                    <a href="login.html" class="action-icon profile-icon" title="Личный кабинет">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <main>
        <section class="cart-section section-padding">
            <div class="container">
                <h1>Корзина</h1>
                <div id="cart-content" class="cart-content">
                    <div class="loading">Загрузка корзины...</div>
                </div>
            </div>
        </section>

        <!-- Modern Chat Widget -->
        <div class="chat-widget">
            <button id="chat-button" class="chat-toggle-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            </button>
            <div id="chat-container" class="chat-container hidden">
                <!-- Chat interface will be loaded here -->
            </div>
        </div>
    </main>

    <footer class="main-footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-column">
                    <h3 class="footer-title">The X Shop</h3>
                    <p>Качественные товары из Китая по доступным ценам</p>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2020 The X Shop. Все права защищены.</p>
            </div>
        </div>
    </footer>

    <!-- Подключаем только необходимые модули -->
    <script src="js/utils.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/modules/cart-manager.js"></script>

    <script>
        // Простая инициализация при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM загружен, инициализируем корзину...');
            
            // Проверяем, что cartManager доступен
            if (typeof cartManager !== 'undefined') {
                console.log('CartManager найден, инициализируем...');
                // cartManager уже инициализируется автоматически через конструктор
            } else {
                console.error('CartManager не найден');
                document.getElementById('cart-content').innerHTML = `
                    <div class="error-message">
                        <p>Ошибка загрузки корзины</p>
                        <button onclick="location.reload()" class="btn btn-primary">Обновить страницу</button>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
