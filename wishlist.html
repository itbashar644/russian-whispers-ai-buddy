    <script>
      // Global config for Supabase and app
      const CONFIG = {
        supabaseUrl: 'https://lpwvhyawvxibtuxfhitx.supabase.co',
        supabaseKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxwd3ZoeWF3dnhpYnR1eGZoaXR4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDY1MzIyOTUsImV4cCI6MjA2MjEwODI5NX0.-2aL1s3lUq4Oeos9jWoEd0Fn1g_-_oaQ_QWVEDByaOI',
        get apiHeaders() {
          return {
            'apikey': this.supabaseKey,
            'Authorization': `Bearer ${this.supabaseKey}`,
            'Content-Type': 'application/json'
          };
        }
      };

      // Utility functions
      function getFromStorage(key, defaultValue = null) {
        try {
          const item = localStorage.getItem(key);
          return item ? JSON.parse(item) : defaultValue;
        } catch (error) {
          console.error(`Ошибка при чтении из localStorage (${key}):`, error);
          return defaultValue;
        }
      }

      function saveToStorage(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
          return true;
        } catch (error) {
          console.error(`Ошибка при сохранении в localStorage (${key}):`, error);
          return false;
        }
      }

      function showNotification(message, type = 'success') {
        const notification = document.createElement('div');
        notification.className = 'notification';
        notification.textContent = message;
        
        notification.style.position = 'fixed';
        notification.style.bottom = '20px';
        notification.style.right = '20px';
        notification.style.backgroundColor = type === 'error' ? '#dc3545' : '#28a745';
        notification.style.color = 'white';
        notification.style.padding = '10px 15px';
        notification.style.borderRadius = '4px';
        notification.style.boxShadow = '0 2px 8px rgba(0, 0, 0, 0.15)';
        notification.style.zIndex = '1000';
        notification.style.opacity = '0';
        notification.style.transform = 'translateY(20px)';
        notification.style.transition = 'opacity 0.3s, transform 0.3s';
        
        document.body.appendChild(notification);
        
        setTimeout(() => {
          notification.style.opacity = '1';
          notification.style.transform = 'translateY(0)';
        }, 10);
        
        setTimeout(() => {
          notification.style.opacity = '0';
          notification.style.transform = 'translateY(20px)';
          
          setTimeout(() => {
            if (notification.parentNode) {
              document.body.removeChild(notification);
            }
          }, 300);
        }, 3000);
      }

      function parsePrice(value) {
        if (typeof value === 'number') return value;
        if (!value) return 0;
        const numeric = parseFloat(String(value).replace(/[^0-9.-]+/g, ''));
        return isNaN(numeric) ? 0 : numeric;
      }

      function formatPrice(price) {
        const value = parsePrice(price);
        return value.toLocaleString('ru-RU') + ' ₽';
      }

      // Cart functions
      let cartInitialized = false;

      function initCart() {
        if (cartInitialized) return;
        cartInitialized = true;
        
        let cart = getFromStorage('cart', []);
        updateCartCounter(cart);
        console.log('Корзина инициализирована, товаров:', cart.length);
      }

      function updateCartCounter(cart) {
        try {
          if (!cart) {
            cart = getFromStorage('cart', []);
          }
          const counters = document.querySelectorAll('.cart-counter');
          const totalItems = cart.reduce((total, item) => total + item.quantity, 0);
          counters.forEach(counter => {
            counter.textContent = totalItems > 0 ? totalItems : '';
            counter.style.display = totalItems > 0 ? 'flex' : 'none';
          });
        } catch (error) {
          console.error('Ошибка при обновлении счетчика корзины:', error);
        }
      }

      function addToCart(product) {
        try {
          let cart = getFromStorage('cart', []);
          const existingProductIndex = cart.findIndex(item => item.id === product.id);
          
          if (existingProductIndex !== -1) {
            cart[existingProductIndex].quantity += 1;
          } else {
            cart.push(product);
          }
          
          saveToStorage('cart', cart);
          updateCartCounter(cart);
          return true;
        } catch (error) {
          console.error('Ошибка при добавлении в корзину:', error);
          return false;
        }
      }

      function handleAddToCart(event) {
        try {
          event.preventDefault();
          event.stopPropagation();
          
          const productCard = event.target.closest('.product-card');
          if (!productCard) return;
          
          const productLink = productCard.querySelector('.product-link');
          if (!productLink) return;
          
          let productId;
          if (productLink.href && productLink.href.includes('id=')) {
            productId = productLink.href.split('id=')[1];
          } else if (productLink.dataset.id) {
            productId = productLink.dataset.id;
          }
          
          if (!productId) return;
          
          const titleElement = productCard.querySelector('h3');
          if (!titleElement) return;
          const productTitle = titleElement.textContent;
          
          const priceElement = productCard.querySelector('.current-price');
          if (!priceElement) return;
          
          const priceText = priceElement.textContent;
          const productPrice = parsePrice(priceText);
          const productImageElement = productCard.querySelector('.product-image img');
          const productImage = productImageElement ? productImageElement.src : '';
          
          const product = {
            id: productId,
            title: productTitle,
            price: productPrice,
            image: productImage,
            quantity: 1
          };
          
          const success = addToCart(product);
          
          if (success) {
            showNotification(`"${productTitle}" добавлен в корзину`);
          } else {
            showNotification('Ошибка при добавлении товара в корзину', 'error');
          }
        } catch (error) {
          console.error('Ошибка в handleAddToCart:', error);
        }
      }

      function initAddToCartButtons() {
        try {
          const existingButtons = document.querySelectorAll('.add-to-cart-btn, .price-cart-btn');
          existingButtons.forEach(button => {
            const newButton = button.cloneNode(true);
            button.parentNode.replaceChild(newButton, button);
          });
          
          const buttons = document.querySelectorAll('.add-to-cart-btn, .price-cart-btn');
          buttons.forEach(button => {
            button.addEventListener('click', handleAddToCart);
          });
        } catch (error) {
          console.error('Ошибка при инициализации кнопок корзины:', error);
        }
      }

      // Wishlist functions
      let wishlistInitialized = false;

      function initWishlist() {
        if (wishlistInitialized) return;
        wishlistInitialized = true;
        updateWishlistButtons();
      }

      function updateWishlistButtons() {
        try {
          let wishlist = getFromStorage('wishlist', []);
          
          if (wishlist.length > 0 && typeof wishlist[0] === 'object') {
            wishlist = wishlist.map(item => item.id);
            saveToStorage('wishlist', wishlist);
          }
          
          const buttons = document.querySelectorAll('.wishlist-button');
          
          buttons.forEach(button => {
            const productCard = button.closest('.product-card');
            if (!productCard) return;
            
            const productLink = productCard.querySelector('.product-link');
            if (!productLink) return;
            
            let productId;
            if (productLink.href && productLink.href.includes('id=')) {
              productId = productLink.href.split('id=')[1];
            } else if (productLink.dataset.id) {
              productId = productLink.dataset.id;
            }
            
            if (!productId) return;
            
            if (wishlist.includes(productId)) {
              button.classList.add('active');
              button.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg>`;
            } else {
              button.classList.remove('active');
              button.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg>`;
            }
          });
        } catch (error) {
          console.error('Ошибка при обновлении кнопок избранного:', error);
        }
      }

      function toggleWishlist(productId, productTitle) {
        try {
          let wishlist = getFromStorage('wishlist', []);
          
          if (wishlist.length > 0 && typeof wishlist[0] === 'object') {
            wishlist = wishlist.map(item => item.id);
            saveToStorage('wishlist', wishlist);
          }
          
          const existingIndex = wishlist.indexOf(productId);
          
          if (existingIndex >= 0) {
            wishlist.splice(existingIndex, 1);
            saveToStorage('wishlist', wishlist);
            updateWishlistButtons();
            showNotification(`"${productTitle}" удален из избранного`);
          } else {
            wishlist.push(productId);
            saveToStorage('wishlist', wishlist);
            updateWishlistButtons();
            showNotification(`"${productTitle}" добавлен в избранное`);
          }
          
          // Обновляем страницу избранного, если мы на ней находимся
          if (window.location.pathname.endsWith('wishlist.html')) {
            renderWishlist();
          }
          
          return true;
        } catch (error) {
          console.error('Ошибка при работе с избранным:', error);
          return false;
        }
      }

      function handleWishlistClick(event) {
        try {
          event.preventDefault();
          event.stopPropagation();
          
          const productCard = event.target.closest('.product-card');
          if (!productCard) return;
          
          const productLink = productCard.querySelector('.product-link');
          if (!productLink) return;
          
          let productId;
          if (productLink.href && productLink.href.includes('id=')) {
            productId = productLink.href.split('id=')[1];
          } else if (productLink.dataset.id) {
            productId = productLink.dataset.id;
          }
          
          if (!productId) return;
          
          const productTitleElement = productCard.querySelector('h3 a') || productCard.querySelector('h3');
          const productTitle = productTitleElement ? productTitleElement.textContent : 'Товар';
          
          toggleWishlist(productId, productTitle);
        } catch (error) {
          console.error('Ошибка в handleWishlistClick:', error);
        }
      }

      function initWishlistButtons() {
        try {
          const existingButtons = document.querySelectorAll('.wishlist-button, .wishlist-btn-large');
          existingButtons.forEach(button => {
            const newButton = button.cloneNode(true);
            button.parentNode.replaceChild(newButton, button);
          });
          
          const buttons = document.querySelectorAll('.wishlist-button, .wishlist-btn-large');
          buttons.forEach(button => {
            button.addEventListener('click', handleWishlistClick);
          });
          
          updateWishlistButtons();
        } catch (error) {
          console.error('Ошибка при инициализации кнопок избранного:', error);
        }
      }

      // Chat functions
      let chatInitialized = false;
      let chatState = null;

      function initChat() {
        if (chatInitialized) return;
        
        const chatButton = document.getElementById('chat-button');
        const chatContainer = document.getElementById('chat-container');
        
        if (!chatButton || !chatContainer) return;
        
        chatInitialized = true;
        
        chatState = getFromStorage('chat_state', {
          open: false,
          messages: []
        });
        
        const newChatButton = chatButton.cloneNode(true);
        chatButton.parentNode.replaceChild(newChatButton, chatButton);
        
        document.getElementById('chat-button').addEventListener('click', handleChatButtonClick);
        document.addEventListener('click', handleDocumentClick);
      }

      function handleChatButtonClick(event) {
        event.stopPropagation();
        event.preventDefault();

        const chatContainer = document.getElementById('chat-container');
        if (chatContainer.classList.contains('hidden')) {
          openChat();
        } else {
          closeChat();
        }
      }

      function handleDocumentClick(event) {
        const chatContainer = document.getElementById('chat-container');
        const chatButton = document.getElementById('chat-button');
        
        if (!chatContainer.classList.contains('hidden')) {
          const isClickInsideChat = chatContainer.contains(event.target);
          const isClickOnChatButton = chatButton && chatButton.contains(event.target);
          
          if (!isClickInsideChat && !isClickOnChatButton) {
            closeChat();
          }
        }
      }

      function openChat() {
        const chatContainer = document.getElementById('chat-container');
        
        if (chatContainer.innerHTML.trim() === '') {
          renderChatInterface();
        }
        
        chatContainer.classList.remove('hidden');
        chatState.open = true;
        saveToStorage('chat_state', chatState);
        
        setTimeout(() => {
          scrollToLatestMessage();
        }, 100);
      }

      function closeChat() {
        const chatContainer = document.getElementById('chat-container');
        chatContainer.classList.add('hidden');
        chatState.open = false;
        saveToStorage('chat_state', chatState);
      }

      function renderChatInterface() {
        const chatContainer = document.getElementById('chat-container');
        
        const chatHTML = `
          <div class="chat-header">
            <h3>Чат с оператором</h3>
            <button class="chat-close-btn" onclick="closeChat()">×</button>
          </div>
          <div class="chat-body">
            <div class="chat-messages" id="chat-messages">
              ${renderChatMessages()}
            </div>
          </div>
          <div class="chat-footer">
            <textarea id="chat-input" placeholder="Введите сообщение..." rows="2"></textarea>
            <button class="chat-send-btn" onclick="sendMessage()">Отправить</button>
          </div>
        `;
        
        chatContainer.innerHTML = chatHTML;
        
        const chatInput = document.getElementById('chat-input');
        if (chatInput) {
          chatInput.addEventListener('keydown', function(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
              event.preventDefault();
              sendMessage();
            }
          });
        }
        
        if (chatState.messages.length === 0) {
          addSystemMessage('Здравствуйте! Чем мы можем вам помочь?');
        }
      }

      function renderChatMessages() {
        return chatState.messages.map(message => {
          let messageClass = '';
          let nameLabel = '';
          
          switch (message.type) {
            case 'user':
              messageClass = 'user-message';
              nameLabel = 'Вы';
              break;
            case 'operator':
              messageClass = 'operator-message';
              nameLabel = 'Оператор';
              break;
            case 'system':
              messageClass = 'system-message';
              nameLabel = 'Система';
              break;
          }
          
          return `
            <div class="chat-message ${messageClass}">
              <span class="message-name">${nameLabel}</span>
              <div class="message-content">${message.text}</div>
              <span class="message-time">${formatDate(message.time)}</span>
            </div>
          `;
        }).join('');
      }

      function addSystemMessage(text) {
        const message = {
          type: 'system',
          text: text,
          time: new Date().toISOString()
        };
        
        chatState.messages.push(message);
        saveToStorage('chat_state', chatState);
        updateChatMessages();
      }

      function updateChatMessages() {
        const chatMessagesEl = document.getElementById('chat-messages');
        if (chatMessagesEl) {
          chatMessagesEl.innerHTML = renderChatMessages();
          scrollToLatestMessage();
        }
      }

      function scrollToLatestMessage() {
        const chatMessagesEl = document.getElementById('chat-messages');
        if (chatMessagesEl) {
          chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
        }
      }

      function formatDate(dateString) {
        const date = new Date(dateString);
        const hours = date.getHours().toString().padStart(2, '0');
        const minutes = date.getMinutes().toString().padStart(2, '0');
        return `${hours}:${minutes}`;
      }

      function sendMessage() {
        const chatInput = document.getElementById('chat-input');
        const message = chatInput.value.trim();
        
        if (!message) return;
        
        const userMessage = {
          type: 'user',
          text: message,
          time: new Date().toISOString()
        };
        
        chatState.messages.push(userMessage);
        saveToStorage('chat_state', chatState);
        updateChatMessages();
        
        chatInput.value = '';
        
        setTimeout(() => {
          const operatorMessage = {
            type: 'operator',
            text: 'Спасибо за ваше сообщение! Наш оператор свяжется с вами в ближайшее время.',
            time: new Date().toISOString()
          };
          
          chatState.messages.push(operatorMessage);
          saveToStorage('chat_state', chatState);
          updateChatMessages();
        }, 2000);
      }

      // Wishlist page specific functions
      function renderWishlist() {
        console.log('Рендерим страницу избранного...');
        
        const wishlistContainer = document.getElementById('wishlist-container');
        if (!wishlistContainer) {
          console.log('Контейнер избранного не найден');
          return;
        }
        
        try {
          let wishlist = getFromStorage('wishlist', []);

          if (wishlist.length > 0 && typeof wishlist[0] === 'object') {
            wishlist = wishlist.map(item => item.id);
            saveToStorage('wishlist', wishlist);
          }
          
          console.log('Загружаем избранные товары, ID:', wishlist);
          
          if (wishlist.length === 0) {
            wishlistContainer.innerHTML = `
              <div class="empty-message">
                <p>У вас нет избранных товаров</p>
                <div class="section-actions" style="margin-top: 2rem;">
                  <a href="catalog.html" class="btn btn-primary">Перейти в каталог</a>
                </div>
              </div>
            `;
            return;
          }
          
          wishlistContainer.innerHTML = '<div class="loading">Загрузка товаров...</div>';
          
          const ids = wishlist.map(id => `"${id}"`).join(',');
          
          console.log('Запрашиваем товары из Supabase с ID:', ids);
          
          fetch(`https://lpwvhyawvxibtuxfhitx.supabase.co/rest/v1/products?id=in.(${ids})&select=*`, {
            headers: CONFIG.apiHeaders
          })
            .then(response => {
              console.log('Ответ от Supabase:', response.status);
              if (!response.ok) {
                throw new Error('Ошибка при загрузке избранных товаров');
              }
              return response.json();
            })
            .then(products => {
              console.log('Получены товары:', products.length);
              
              if (products.length === 0) {
                wishlistContainer.innerHTML = `
                  <div class="empty-message">
                    <p>Товары из вашего списка избранного не найдены</p>
                    <div class="section-actions" style="margin-top: 2rem;">
                      <a href="catalog.html" class="btn btn-primary">Перейти в каталог</a>
                    </div>
                  </div>
                `;
                return;
              }
              
              let productsHTML = '<div class="products-grid">';
              
              products.forEach(product => {
                const priceDisplay = product.discount_price
                  ? `<span class="old-price">${formatPrice(product.price)}</span><span class="current-price with-background">${formatPrice(product.discount_price)}</span>`
                  : `<span class="current-price with-background">${formatPrice(product.price)}</span>`;
                
                let marketplaceLinks = '';
                if (product.ozon_url || product.wildberries_url || product.avito_url) {
                  let marketplaceIconsHtml = '';

                  if (product.wildberries_url) {
                    marketplaceIconsHtml += `
                      <a href="${product.wildberries_url}" target="_blank" rel="noopener noreferrer" class="marketplace-icon wildberries-icon" title="Открыть на Wildberries">
                        <img src="/lovable-uploads/e338f2d1-bca5-46f1-b305-fdc8cff079f6.png" alt="Wildberries">
                      </a>
                    `;
                  }

                  if (product.ozon_url) {
                    marketplaceIconsHtml += `
                      <a href="${product.ozon_url}" target="_blank" rel="noopener noreferrer" class="marketplace-icon ozon-icon" title="Открыть на Ozon">
                        <img src="/lovable-uploads/cdd6cfcc-2939-4048-ad14-0718ccb5108b.png" alt="Ozon">
                      </a>
                    `;
                  }

                  if (product.avito_url) {
                    marketplaceIconsHtml += `
                      <a href="${product.avito_url}" target="_blank" rel="noopener noreferrer" class="marketplace-icon avito-icon" title="Открыть на Авито">
                        <img src="/lovable-uploads/c9a01e33-cfba-4882-bd76-bf5242276fda.png" alt="Авито">
                      </a>
                    `;
                  }

                  marketplaceLinks = `
                    <div class="marketplace-links">
                      <span class="marketplace-title">Доступен на:</span>
                      <div class="marketplace-icons">
                        ${marketplaceIconsHtml}
                      </div>
                    </div>
                  `;
                }
                
                productsHTML += `
                  <div class="product-card">
                    <div class="product-image">
                      <a href="product.html?id=${product.id}" class="product-link" data-id="${product.id}">
                        <img src="${product.image_url}" alt="${product.title}" loading="lazy">
                      </a>
                      <button class="wishlist-button active" aria-label="Удалить из избранного" data-id="${product.id}">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg>
                      </button>
                    </div>
                    <div class="product-info">
                      <h3>
                        <a href="product.html?id=${product.id}" class="product-link" data-id="${product.id}">${product.title}</a>
                      </h3>
                      <div class="product-price">
                        <button class="price-cart-btn" data-id="${product.id}" aria-label="Добавить в корзину">
                          ${priceDisplay}
                          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
                        </button>
                      </div>
                      ${marketplaceLinks}
                      <button class="add-to-cart-btn" data-id="${product.id}">В корзину</button>
                    </div>
                  </div>
                `;
              });
              
              productsHTML += '</div>';
              wishlistContainer.innerHTML = productsHTML;
              
              console.log('Инициализируем обработчики после рендеринга избранного');
              setTimeout(() => {
                initAddToCartButtons();
                initWishlistButtons();
              }, 100);
              
            })
            .catch(error => {
              console.error('Ошибка при загрузке избранных товаров:', error);
              wishlistContainer.innerHTML = `
                <div class="error-message">
                  <p>Ошибка при загрузке избранных товаров: ${error.message}</p>
                  <div class="section-actions" style="margin-top: 2rem;">
                    <a href="catalog.html" class="btn btn-primary">Перейти в каталог</a>
                  </div>
                </div>
              `;
            });
        } catch (error) {
          console.error('Ошибка при рендеринге избранного:', error);
          wishlistContainer.innerHTML = `
            <div class="error-message">
              <p>Ошибка при загрузке избранных товаров</p>
              <div class="section-actions" style="margin-top: 2rem;">
                <a href="catalog.html" class="btn btn-primary">Перейти в каталог</a>
              </div>
            </div>
          `;
        }
      }

      // Main initialization
      function initializeApp() {
        console.log('Инициализируем приложение для wishlist...');
        
        initCart();
        initWishlist();
        initChat();
        
        // Рендерим страницу избранного
        renderWishlist();
        
        setTimeout(() => {
          initAddToCartButtons();
          initWishlistButtons();
          updateCartCounter();
        }, 200);
      }

      // Initialize when DOM is loaded
      document.addEventListener('DOMContentLoaded', initializeApp);

      // Make functions globally accessible
      window.openChat = openChat;
      window.closeChat = closeChat;
      window.sendMessage = sendMessage;
    </script>
  </body>
</html>
