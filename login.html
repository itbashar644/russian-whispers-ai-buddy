    <!-- Необходимый скрипт для Lovable -->

    <script type="module">
      import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

      // Правильная конфигурация Supabase
      const supabaseUrl = 'https://lpwvhyawvxibtuxfhitx.supabase.co';
      const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxwd3ZoeWF3dnhpYnR1eGZoaXR4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDY1MzIyOTUsImV4cCI6MjA2MjEwODI5NX0.-2aL1s3lUq4Oeos9jWoEd0Fn1g_-_oaQ_QWVEDByaOI';

      const supabase = createClient(supabaseUrl, supabaseKey, {
        auth: {
          persistSession: true,
          detectSessionInUrl: true,
          autoRefreshToken: true
        }
      });

      // Делаем supabase доступным глобально
      window.supabase = supabase;

      function showNotification(message, type = 'info') {
        const notification = document.createElement('div');
        notification.className = `notification ${type}`;
        notification.textContent = message;
        notification.style.cssText = `
          position: fixed;
          top: 20px;
          right: 20px;
          background: ${type === 'success' ? '#28a745' : type === 'error' ? '#dc3545' : '#007bff'};
          color: white;
          padding: 12px 24px;
          border-radius: 4px;
          z-index: 1000;
          animation: slideIn 0.3s ease;
        `;
        document.body.appendChild(notification);
        setTimeout(() => {
          notification.remove();
        }, 3000);
      }

      // Обработчик отправки формы авторизации
      document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();

        // Простая валидация
        if (!email || !password) {
          showNotification('Заполните все поля', 'error');
          return;
        }

        try {
          const { data, error } = await supabase.auth.signInWithPassword({ 
            email, 
            password 
          });
          
          if (error) {
            console.error('Ошибка авторизации:', error);
            showNotification(error.message || 'Ошибка авторизации', 'error');
            return;
          }

          showNotification('Успешная авторизация!', 'success');
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1500);
        } catch (err) {
          console.error('Неожиданная ошибка при авторизации:', err);
          showNotification('Не удалось войти', 'error');
        }
      });

      // Обработчик входа через Google
      document.getElementById('googleLoginBtn').addEventListener('click', async () => {
        try {
          const { data, error } = await supabase.auth.signInWithOAuth({
            provider: 'google',
            options: {
              redirectTo: `${window.location.origin}/auth-callback.html`
            }
          });
          
          if (error) {
            console.error('Ошибка входа через Google:', error);
            showNotification('Ошибка входа через Google', 'error');
          }
        } catch (err) {
          console.error('Неожиданная ошибка при входе через Google:', err);
          showNotification('Не удалось войти через Google', 'error');
        }
      });
    </script>
