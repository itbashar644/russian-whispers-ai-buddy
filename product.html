
<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Просмотр товара | The X Shop</title>
    <meta name="description" content="Подробная информация о товаре" />
    <meta name="keywords" content="товары из китая, интернет-магазин" />
    
    <!-- CSS стили -->
    <link rel="stylesheet" href="styles.css">
    <style>
      /* Стили для аспектного соотношения изображений */
      .product-image img {
        aspect-ratio: 3/4;
        object-fit: cover;
        width: 100%;
      }
      
      /* Стили для маркетплейсов */
      .marketplace-links {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 15px 0;
        padding: 10px 0;
      }
      
      .marketplace-text {
        font-size: 0.9rem;
        color: #666;
        margin-right: 10px;
      }
      
      .marketplace-icons {
        display: flex;
        gap: 12px;
      }
      
      .marketplace-icon {
       width: 32px;
        height: 32px;
        border-radius: 4px;
        overflow: hidden;
        transition: transform 0.2s;
      }
      
      .marketplace-icon:hover {
        transform: scale(1.1);
      }
      
      .marketplace-link {
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="container header-container">
        <div class="header-left">
          <a href="index.html" class="logo">The X Shop</a>
          <nav class="main-nav">
            <ul>
              <li><a href="index.html">Главная</a></li>
              <li><a href="catalog.html">Каталог</a></li>
              <li><a href="about.html">О нас</a></li>
              <li><a href="contacts.html">Контакты</a></li>
            </ul>
          </nav>
        </div>
        <div class="header-actions">
          <button class="icon-button search-button" aria-label="Поиск">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
          </button>
          <a href="wishlist.html" class="icon-button" aria-label="Избранное">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg>
          </a>
          <a href="cart.html" class="icon-button" aria-label="Корзина">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"></circle><circle cx="19" cy="21" r="1"></circle><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"></path></svg>
            <span class="cart-counter"></span>
          </a>
          <a href="login.html" class="icon-button" aria-label="Личный кабинет">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          </a>
        </div>
      </div>
    </header>

    <main>
      <div class="container py-8">
        <div class="product-details-container">
          <!-- Содержимое будет загружено с помощью JavaScript -->
          <div class="loading">Загрузка информации о товаре...</div>
        </div>
        
        <!-- Шаблон для отображения маркетплейсов (будет использован в JS) -->
        <template id="marketplace-template">
          <div class="marketplace-links">
            <span class="marketplace-text">Доступен на:</span>
            <div class="marketplace-icons">
              <a href="#" class="marketplace-link ozon-link" target="_blank">
                <img src="/lovable-uploads/cdd6cfcc-2939-4048-ad14-0718ccb5108b.png" alt="Ozon" class="marketplace-icon">
              </a>
              <a href="#" class="marketplace-link wildberries-link" target="_blank">
                <img src="/lovable-uploads/e338f2d1-bca5-46f1-b305-fdc8cff079f6.png" alt="Wildberries" class="marketplace-icon">
              </a>
              <a href="#" class="marketplace-link avito-link" target="_blank">
                <img src="/lovable-uploads/c9a01e33-cfba-4882-bd76-bf5242276fda.png" alt="Avito" class="marketplace-icon">
              </a>
            </div>
          </div>
        </template>
      </div>
    </main>
    
    <footer class="footer">
      <div class="container">
        <div class="footer-grid">
          <div class="footer-column">
            <h4>The X Shop</h4>
            <p>Товары из Китая для вашего дома</p>
          </div>
          <div class="footer-column">
            <h4>Информация</h4>
            <ul>
              <li><a href="about.html">О нас</a></li>
              <li><a href="delivery.html">Доставка</a></li>
              <li><a href="contacts.html">Контакты</a></li>
            </ul>
          </div>
          <div class="footer-column">
            <h4>Помощь</h4>
            <ul>
              <li><a href="terms.html">Условия использования</a></li>
              <li><a href="privacy.html">Политика конфиденциальности</a></li>
            </ul>
          </div>
         
        </div>
        <div class="footer-bottom">
          <p>&copy; 2024 The X Shop. Все права защищены.</p>
        </div>
      </div>
    </footer>
