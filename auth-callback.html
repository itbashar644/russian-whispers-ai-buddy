
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация | The X Shop</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/chat-styles.css">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <a href="index.html"><img src="public/The X Shop text.svg" alt="The X Shop" /></a>
                </div>
                <nav class="main-nav">
                    <ul class="nav-list">
                        <li><a href="index.html" class="nav-link">Главная</a></li>
                        <li><a href="catalog.html" class="nav-link">Каталог</a></li>
                        <li><a href="about.html" class="nav-link">О нас</a></li>
                        <li><a href="contacts.html" class="nav-link">Контакты</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <main>
        <div class="container" style="text-align: center; padding: 4rem 2rem; min-height: 60vh;">
            <div id="auth-status" class="auth-status">
                <h1>Вход в систему</h1>
                <p>Загрузка...</p>
            </div>
            
            <div id="login-form" class="login-form" style="display: none; max-width: 400px; margin: 0 auto;">
                <h2>Авторизация</h2>
                <form id="auth-form">
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Пароль:</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Войти</button>
                        <button type="button" id="signup-btn" class="btn btn-outline">Регистрация</button>
                    </div>
                </form>
                <div id="auth-error" class="error-message" style="display: none; color: red; margin-top: 1rem;"></div>
            </div>

            <div id="signup-form" class="signup-form" style="display: none; max-width: 400px; margin: 0 auto;">
                <h2>Регистрация</h2>
                <form id="signup-form-element">
                    <div class="form-group">
                        <label for="signup-email">Email:</label>
                        <input type="email" id="signup-email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="signup-password">Пароль:</label>
                        <input type="password" id="signup-password" name="password" required>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
                        <button type="button" id="login-btn" class="btn btn-outline">Уже есть аккаунт?</button>
                    </div>
                </form>
                <div id="signup-error" class="error-message" style="display: none; color: red; margin-top: 1rem;"></div>
            </div>
        </div>

        <!-- Chat Button -->
        <div class="chat-widget">
            <button id="chat-button" class="chat-toggle-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            </button>
            <div id="chat-container" class="chat-container hidden">
                <!-- Chat interface will be loaded here -->
            </div>
        </div>
    </main>

    <footer class="main-footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-column">
                    <h3 class="footer-title">The X Shop</h3>
                    <p>Качественные товары из Китая по доступным ценам</p>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2020 The X Shop. Все права защищены.</p>
            </div>
        </div>
    </footer>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        const supabase = createClient(
            'https://lpwvhyawvxibtuxfhitx.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxwd3ZoeWF3dnhpYnR1eGZoaXR4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDY1MzIyOTUsImV4cCI6MjA2MjEwODI5NX0.-2aL1s3lUq4Oeos9jWoEd0Fn1g_-_oaQ_QWVEDByaOI',
            {
                auth: {
                    storage: localStorage,
                    persistSession: true,
                    autoRefreshToken: true,
                }
            }
        );

        const authStatus = document.getElementById('auth-status');
        const loginForm = document.getElementById('login-form');
        const signupForm = document.getElementById('signup-form');
        const authForm = document.getElementById('auth-form');
        const signupFormElement = document.getElementById('signup-form-element');

        async function checkAuthStatus() {
            try {
                const { data, error } = await supabase.auth.getSession();
                
                if (error) {
                    console.error('Ошибка при получении сессии:', error);
                    showLoginForm();
                    return;
                }

                if (data.session) {
                    authStatus.innerHTML = `
                        <h1>Добро пожаловать!</h1>
                        <p>Вы успешно авторизованы</p>
                        <button onclick="window.location.href='index.html'" class="btn btn-primary">Перейти на главную</button>
                        <button onclick="logout()" class="btn btn-outline">Выйти</button>
                    `;
                } else {
                    showLoginForm();
                }
            } catch (error) {
                console.error('Ошибка:', error);
                showLoginForm();
            }
        }

        function showLoginForm() {
            authStatus.style.display = 'none';
            loginForm.style.display = 'block';
            signupForm.style.display = 'none';
        }

        function showSignupForm() {
            authStatus.style.display = 'none';
            loginForm.style.display = 'none';
            signupForm.style.display = 'block';
        }

        // Event listeners
        document.getElementById('signup-btn').addEventListener('click', showSignupForm);
        document.getElementById('login-btn').addEventListener('click', showLoginForm);

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('auth-error');

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email,
                    password,
                });

                if (error) {
                    errorDiv.textContent = 'Ошибка входа: ' + error.message;
                    errorDiv.style.display = 'block';
                } else {
                    window.location.href = 'index.html';
                }
            } catch (error) {
                errorDiv.textContent = 'Произошла ошибка: ' + error.message;
                errorDiv.style.display = 'block';
            }
        });

        signupFormElement.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            const errorDiv = document.getElementById('signup-error');

            try {
                const { data, error } = await supabase.auth.signUp({
                    email,
                    password,
                    options: {
                        emailRedirectTo: `${window.location.origin}/auth-callback.html`
                    }
                });

                if (error) {
                    errorDiv.textContent = 'Ошибка регистрации: ' + error.message;
                    errorDiv.style.display = 'block';
                } else {
                    authStatus.innerHTML = `
                        <h1>Регистрация успешна!</h1>
                        <p>Проверьте email для подтверждения аккаунта</p>
                        <button onclick="showLoginForm()" class="btn btn-primary">Войти</button>
                    `;
                    authStatus.style.display = 'block';
                    signupForm.style.display = 'none';
                }
            } catch (error) {
                errorDiv.textContent = 'Произошла ошибка: ' + error.message;
                errorDiv.style.display = 'block';
            }
        });

        window.logout = async function() {
            await supabase.auth.signOut();
            window.location.href = 'auth-callback.html';
        };

        window.showLoginForm = showLoginForm;
        window.showSignupForm = showSignupForm;

        // Чат функциональность - встроенная
        let chatInitialized = false;
        let chatState = null;

        function getFromStorage(key, defaultValue = null) {
          try {
            const item = localStorage.getItem(key);
            return item ? JSON.parse(item) : defaultValue;
          } catch (error) {
            console.error(`Ошибка при чтении из localStorage (${key}):`, error);
            return defaultValue;
          }
        }

        function saveToStorage(key, value) {
          try {
            localStorage.setItem(key, JSON.stringify(value));
            return true;
          } catch (error) {
            console.error(`Ошибка при сохранении в localStorage (${key}):`, error);
            return false;
          }
        }

        function initChat() {
          console.log('Инициализируем чат...');
          
          if (chatInitialized) {
            console.log('Чат уже инициализирован');
            return;
          }
          
          const chatButton = document.getElementById('chat-button');
          const chatContainer = document.getElementById('chat-container');
          
          if (!chatButton || !chatContainer) {
            console.log('Элементы чата не найдены:', { 
              chatButton: !!chatButton, 
              chatContainer: !!chatContainer 
            });
            return;
          }
          
          chatInitialized = true;
          
          chatState = getFromStorage('chat_state', {
            open: false,
            messages: []
          });
          
          chatButton.removeEventListener('click', handleChatButtonClick);
          document.removeEventListener('click', handleDocumentClick);
          
          chatButton.addEventListener('click', handleChatButtonClick);
          document.addEventListener('click', handleDocumentClick);
          
          console.log('Чат инициализирован');
        }

        function handleChatButtonClick(event) {
          console.log('Кнопка чата нажата');
          event.stopPropagation();
          event.preventDefault();

          const chatContainer = document.getElementById('chat-container');
          if (chatContainer.classList.contains('hidden')) {
            openChat();
          } else {
            closeChat();
          }
        }

        function handleDocumentClick(event) {
          const chatContainer = document.getElementById('chat-container');
          const chatButton = document.getElementById('chat-button');
          
          if (!chatContainer.classList.contains('hidden')) {
            const isClickInsideChat = chatContainer.contains(event.target);
            const isClickOnChatButton = chatButton && chatButton.contains(event.target);
            
            if (!isClickInsideChat && !isClickOnChatButton) {
              closeChat();
            }
          }
        }

        function openChat() {
          console.log('Открываем чат');
          const chatContainer = document.getElementById('chat-container');
          
          if (chatContainer.innerHTML.trim() === '') {
            renderChatInterface();
          }
          
          chatContainer.classList.remove('hidden');
          chatState.open = true;
          saveToStorage('chat_state', chatState);
          
          setTimeout(() => {
            scrollToLatestMessage();
          }, 100);
        }

        function closeChat() {
          console.log('Закрываем чат');
          const chatContainer = document.getElementById('chat-container');
          chatContainer.classList.add('hidden');
          chatState.open = false;
          saveToStorage('chat_state', chatState);
        }

        function renderChatInterface() {
          console.log('Рендерим интерфейс чата');
          const chatContainer = document.getElementById('chat-container');
          
          const chatHTML = `
            <div class="chat-header">
              <h3>Чат с оператором</h3>
              <button class="chat-close-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
              </button>
            </div>
            <div class="chat-body">
              <div class="chat-messages" id="chat-messages">
                ${renderChatMessages()}
              </div>
            </div>
            <div class="chat-footer">
              <textarea id="chat-input" placeholder="Введите сообщение..." rows="2"></textarea>
              <button class="chat-send-btn" id="chat-send-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
              </button>
            </div>
          `;
          
          chatContainer.innerHTML = chatHTML;
          
          const closeBtn = chatContainer.querySelector('.chat-close-btn');
          if (closeBtn) {
            closeBtn.addEventListener('click', closeChat);
          }
          
          const sendBtn = chatContainer.querySelector('#chat-send-btn');
          if (sendBtn) {
            sendBtn.addEventListener('click', function(event) {
              event.preventDefault();
              sendMessage();
            });
          }
          
          const chatInput = chatContainer.querySelector('#chat-input');
          if (chatInput) {
            chatInput.addEventListener('keydown', function(event) {
              if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
              }
            });
          }
          
          if (chatState.messages.length === 0) {
            addSystemMessage('Здравствуйте! Чем мы можем вам помочь?');
          }
        }

        function renderChatMessages() {
          return chatState.messages.map(message => {
            let messageClass = '';
            let nameLabel = '';
            
            switch (message.type) {
              case 'user':
                messageClass = 'user-message';
                nameLabel = 'Вы';
                break;
              case 'operator':
                messageClass = 'operator-message';
                nameLabel = 'Оператор';
                break;
              case 'system':
                messageClass = 'system-message';
                nameLabel = 'Система';
                break;
              default:
                messageClass = '';
                nameLabel = '';
            }
            
            return `
              <div class="chat-message ${messageClass}">
                <span class="message-name">${nameLabel}</span>
                <div class="message-content">${message.text}</div>
                <span class="message-time">${formatDate(message.time)}</span>
              </div>
            `;
          }).join('');
        }

        function addSystemMessage(text) {
          const message = {
            type: 'system',
            text: text,
            time: new Date().toISOString()
          };
          
          chatState.messages.push(message);
          saveToStorage('chat_state', chatState);
          updateChatMessages();
        }

        function updateChatMessages() {
          const chatContainer = document.getElementById('chat-container');
          const chatMessagesEl = chatContainer.querySelector('#chat-messages');
          if (chatMessagesEl) {
            chatMessagesEl.innerHTML = renderChatMessages();
            scrollToLatestMessage();
          }
        }

        function scrollToLatestMessage() {
          const chatContainer = document.getElementById('chat-container');
          const chatMessagesEl = chatContainer.querySelector('#chat-messages');
          if (chatMessagesEl) {
            chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
          }
        }

        function formatDate(dateString) {
          const date = new Date(dateString);
          const hours = date.getHours().toString().padStart(2, '0');
          const minutes = date.getMinutes().toString().padStart(2, '0');
          return `${hours}:${minutes}`;
        }

        function sendMessage() {
          const chatContainer = document.getElementById('chat-container');
          const chatInput = chatContainer.querySelector('#chat-input');
          const message = chatInput.value.trim();
          
          if (!message) return;
          
          const userMessage = {
            type: 'user',
            text: message,
            time: new Date().toISOString()
          };
          
          chatState.messages.push(userMessage);
          saveToStorage('chat_state', chatState);
          updateChatMessages();
          
          chatInput.value = '';
          
          setTimeout(() => {
            const operatorMessage = {
              type: 'operator',
              text: 'Спасибо за обращение! Как я могу вам помочь?',
              time: new Date().toISOString()
            };
            
            chatState.messages.push(operatorMessage);
            saveToStorage('chat_state', chatState);
            updateChatMessages();
          }, 2000);
        }

        // Инициализация чата
        initChat();

        // Проверка статуса авторизации при загрузке
        checkAuthStatus();
    </script>
</body>
</html>
